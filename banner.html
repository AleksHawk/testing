<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1B Transactions — Style #1</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;500;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,400;1,500&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0a;font-family:'Space Grotesk',sans-serif;color:#fff;padding:40px 24px;}
.container{max-width:1400px;margin:0 auto;}
.controls{display:flex;gap:16px;margin-bottom:32px;justify-content:center;flex-wrap:wrap;}
button{font-family:'Unbounded',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;padding:12px 24px;border:none;border-radius:6px;cursor:pointer;transition:all 0.3s;}
.btn-download{background:#AA00FF;color:#0a0a0a;}
.btn-download:hover{background:#8800cc;transform:scale(1.05);}
.banner{width:1600px;height:900px;background:#0a0a0a;position:relative;overflow:hidden;margin:0 auto;border:1px solid rgba(255,255,255,.1);}
/* bg blobs */
.banner::before{content:'';position:absolute;top:-200px;right:-150px;width:800px;height:800px;background:radial-gradient(circle,#AA00FF 0%,transparent 60%);opacity:.35;filter:blur(80px);}
.banner::after{content:'';position:absolute;bottom:-200px;left:-100px;width:600px;height:600px;background:radial-gradient(circle,#2545F6 0%,transparent 60%);opacity:.25;filter:blur(100px);}
/* grid */
.grid-overlay{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:80px 80px;z-index:0;}
/* watermark word */
.watermark{position:absolute;right:-30px;top:120px;font-family:'Unbounded',sans-serif;font-weight:900;font-size:340px;letter-spacing:-12px;color:rgba(170,0,255,.08);line-height:1;z-index:1;}
.content{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;}
/* top bar */
.top-bar{position:absolute;top:50px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;font-family:'Unbounded',sans-serif;font-size:12px;letter-spacing:3px;color:rgba(255,255,255,.5);}
.top-bar-right{font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:1.5px;color:rgba(255,255,255,.4);}
/* main */
.main{position:absolute;left:60px;top:240px;max-width:900px;}
.main h1{font-family:'Unbounded',sans-serif;font-weight:900;font-size:84px;line-height:.95;letter-spacing:-3px;color:#fff;margin-bottom:34px;}
.main h1 .highlight{background:#AA00FF;color:#0a0a0a;padding:0 22px;border-radius:6px;display:inline-block;}
.divider{height:2px;width:120px;background:#AA00FF;margin-bottom:24px;}
.main p{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:28px;color:#FCF2D8;max-width:720px;line-height:1.4;}
/* bottom */
.bottom{position:absolute;bottom:50px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;}
.social{display:flex;align-items:center;gap:18px;font-family:'Space Grotesk',sans-serif;font-size:14px;color:rgba(255,255,255,.45);}
.social-item{display:flex;align-items:center;gap:7px;}
.sep{width:1px;height:14px;background:rgba(255,255,255,.18);}
.link{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.3);letter-spacing:1px;}
</style>
</head>
<body>

<div class="container">
  <div class="controls">
    <button class="btn-download" onclick="downloadPNG('001')">↓ DOWNLOAD PNG — Style #1</button>
  </div>

  <div id="banner001" class="banner">
    <div class="grid-overlay"></div>
    <div class="watermark">REAL<br>TIME</div>
    
    <div class="top-bar">
      <span>MAGICBLOCK · INFRASTRUCTURE</span>
      <span class="top-bar-right">1B / TRANSACTIONS</span>
    </div>
    
    <div class="main">
      <h1>1 billion<br>transactions<br><span class="highlight">processed</span></h1>
      <div class="divider"></div>
      <p>27K addresses executing real-time games, trades, and rounds on Solana since June 2025. That's not marketing — that's proof the engine works.</p>
    </div>
    
    <div class="bottom">
      <div class="social">
        <div class="social-item">@magicblock</div>
        <div class="sep"></div>
        <div class="social-item">magicblock.xyz</div>
      </div>
      <div class="link">→ EPHEMERAL.ROLLUPS</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function downloadPNG(id) {
  const banner = document.getElementById('banner' + id);
  html2canvas(banner, {
    backgroundColor: '#0a0a0a',
    scale: 2,
    logging: false
  }).then(canvas => {
    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = id + '-style-1-headline.png';
    link.click();
  });
}
</script>

</body>
</html>
